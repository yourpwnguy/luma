# luma configuration
#
# Run from the repository root so this file is found automatically, or pass
# --config /path/to/luma.toml. Device ids are arbitrary; use them with
# `luma run --devices mouse,laptop`.

[general]
# 30 fps is the verified K617 per-key streaming rate. The ASUS EC is slower,
# so its worker defaults to 15 fps even when the engine runs at 30.
fps = 30
# duration_secs = 30
on_error = "continue"
stats_interval_secs = 5.0

[effect]
# "aurora" is the full-field default: every key stays lit.
# Try "constellation", "circuit", "ribbon", or "bloom" for the other
# full-field looks, or "flow", "orbit", "chase", "pulse", or "pingpong" for
# effects that travel across all three devices. The older per-device effects
# still work.
#
# The five full-field effects use their own signature palettes. --color does
# not recolor them; it still works for the older effects.
name = "aurora"
color = "#00aaff"
speed = 1.0
brightness = 0.8
wave_cycles = 2.0

[[devices]]
id = "keyboard"
type = "k617"
enabled = true
required = true
max_fps = 30

[[devices]]
id = "mouse"
type = "g102"
enabled = true
required = true
max_fps = 30
[devices.restore]
# The G102 protocol has no reliable "read current color" command, so restore
# applies a known safe default instead of pretending to recover the old frame.
policy = "default"
color = "#ffffff"
brightness = 0.30

[[devices]]
id = "laptop"
type = "asus_tuf"
enabled = true
required = true
max_fps = 15
[devices.options]
# Runtime hardware brightness level, 0..=3. The original level is restored.
hardware_brightness = 3
[devices.restore]
# The ASUS ABI is write-only, so the previous mode cannot be read. Restore a
# neutral static color and put the original hardware brightness back.
policy = "default"
color = "#ffffff"
hardware_brightness = 2

# The flow effects move around a shared 0..1 loop. Each device owns a slice of
# that loop. The slices are visited in start order, so this default runs:
# keyboard -> mouse -> laptop. The space from 0.85 to 1.00 is intentionally
# dark so the restart is visible. Change the start/end values to reverse the
# order or make one device linger longer.
[[stage.devices]]
id = "keyboard"
start = 0.00
end = 0.45

[[stage.devices]]
id = "mouse"
start = 0.45
end = 0.70

[[stage.devices]]
id = "laptop"
start = 0.70
end = 0.85
